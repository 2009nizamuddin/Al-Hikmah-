name: Record Live Broadcast

on:
  schedule:
    # Every 5 minutes — the minimum interval GitHub Actions allows. Most
    # runs just check the status and exit in a few seconds — recording
    # only happens on the run(s) that catch a live broadcast. Note:
    # GitHub only guarantees this on a best-effort basis and can delay a
    # scheduled run by several minutes during busy periods — this is a
    # platform limit, not something this workflow controls. If a broadcast
    # is missed for a while, you can always trigger it instantly yourself
    # with "Run workflow" below.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# If a recording from an earlier run is still going when the next
# schedule tick fires, this makes the new run wait in a queue instead of
# starting a second, overlapping recording. Once the recording finishes,
# queued runs each check status (now offline) and exit immediately.
concurrency:
  group: al-hikmah-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    # A bit above GitHub's own 6-hour hard job ceiling isn't possible (that
    # ceiling can't be raised), so this just needs to be at least that high;
    # the script itself now stops starting new segments with headroom to
    # spare (see JOB_SOFT_LIMIT_MS in record-live.js) so the job always
    # finishes cleanly on its own before this would ever be hit.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Check live status and record if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set a repo variable LIVE_STATUS_URL if the site's
          # domain ever changes. Falls back to the current one otherwise.
          STATUS_URL: ${{ vars.LIVE_STATUS_URL }}
        run: node scripts/record-live.js

