name: Clean Up Old Recordings

on:
  schedule:
    - cron: '0 20 * * *' # once a day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove recordings older than the retention window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # How many days of recordings to keep. Change this value (and
          # re-commit) to adjust the retention window.
          RETENTION_DAYS: 90
        run: node scripts/cleanup-archive.js

